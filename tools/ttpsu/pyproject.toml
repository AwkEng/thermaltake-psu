[project]
name = "ttpsu"
version = "0.1.0b1"
authors = [{ name = "awkeng" }]
description = "Unofficial monitoring tool for Thermaltake Toughpower DPS G USB PSUs"
readme = "README.md"
license = "GPL-2.0-or-later"
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.scripts]
ttpsu = "ttpsu.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
